name: "Test - DEV"
on:
  push:
    branches:
      - main

jobs:
  run-tests:
    name: "Run tests job"
    uses: ./.github/workflows/_tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  github-release:
    if: "startsWith(github.event.head_commit.message, 'chore(CI/CD): bump version')"
    name: "GitHub release job"
    needs: [run-tests]
    uses: ./.github/workflows/gh-release.yml
    secrets:
      CICD_PAT_TOKEN: ${{ secrets.CICD_PAT_TOKEN }}
