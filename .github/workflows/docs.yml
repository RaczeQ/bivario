name: "Build & deploy docs"
on:
  # Started by "Build & publish - PROD". Not on the release itself: it runs on a tag, which the
  # github-pages environment does not accept.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:
    name: Build docs 📚
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Execute notebooks, draw the palettes and build docs
        run: uv run tox -e docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Not a step of the build: right after the upload, deploy-pages often does not see the artifact yet
  # (https://github.com/actions/deploy-pages/issues/451).
  deploy:
    name: Deploy docs to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
